version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
